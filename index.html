<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="iPlanIt"/>
<title>iPlanIt</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;--blue-text:#0C447C;
    --green:#1D9E75;--green-light:#E1F5EE;--green-text:#085041;
    --amber:#BA7517;--amber-light:#FAEEDA;--amber-text:#633806;
    --red:#E24B4A;--red-light:#FCEBEB;--red-text:#791F1F;
    --gray-bg:#F5F5F5;--card-bg:#fff;--border:#e5e5e5;
    --text:#1a1a1a;--text-secondary:#666;--text-tertiary:#999;
  }
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--gray-bg);color:var(--text);min-height:100vh;}
  .app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--gray-bg);}
  .header{background:#fff;padding:env(safe-area-inset-top,16px) 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
  .header-title{font-size:20px;font-weight:600;color:var(--text);}
  .sync-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 10px;border-radius:20px;border:none;cursor:pointer;font-weight:500;}
  .sync-btn.ok{background:var(--green-light);color:var(--green-text);}
  .sync-btn.loading{background:var(--amber-light);color:var(--amber-text);}
  .sync-btn.err{background:var(--red-light);color:var(--red-text);}
  .nav{display:flex;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:57px;z-index:9;}
  .nav::-webkit-scrollbar{display:none;}
  .nav-item{flex:0 0 auto;padding:10px 16px;font-size:13px;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
  .nav-item.active{color:var(--blue);border-bottom:2px solid var(--blue);}
  .content{flex:1;padding:16px;padding-bottom:90px;}
  .hero{background:var(--blue);border-radius:16px;padding:20px;margin-bottom:16px;}
  .hero-label{font-size:12px;color:#B5D4F4;margin-bottom:6px;}
  .hero-amount{font-size:30px;font-weight:700;color:#fff;margin-bottom:4px;}
  .hero-sub{font-size:12px;color:#85B7EB;}
  .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .stat{background:#fff;border-radius:12px;border:1px solid var(--border);padding:12px 14px;}
  .stat-label{font-size:11px;color:var(--text-secondary);margin-bottom:4px;}
  .stat-val{font-size:18px;font-weight:600;color:var(--text);}
  .stat-val.green{color:var(--green);}
  .stat-val.amber{color:var(--amber);}
  .section-label{font-size:11px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;}
  .card{background:#fff;border-radius:14px;border:1px solid var(--border);padding:14px 16px;margin-bottom:12px;}
  .card-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
  .card-name{font-size:15px;font-weight:600;color:var(--text);}
  .card-sub{font-size:12px;color:var(--text-secondary);margin-top:3px;}
  .card-amount{font-size:15px;font-weight:600;color:var(--text);text-align:right;}
  .card-amount-sub{font-size:11px;color:var(--text-secondary);text-align:right;margin-top:3px;}
  .pbar{height:6px;background:#f0f0f0;border-radius:4px;overflow:hidden;margin-bottom:10px;}
  .pfill{height:100%;border-radius:4px;transition:width 0.5s ease;}
  .meta{display:flex;gap:14px;flex-wrap:wrap;}
  .meta-item{font-size:12px;color:var(--text-secondary);display:flex;align-items:center;gap:4px;}
  .badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:500;}
  .badge.green{background:var(--green-light);color:var(--green-text);}
  .badge.amber{background:var(--amber-light);color:var(--amber-text);}
  .badge.blue{background:var(--blue-light);color:var(--blue-text);}
  .badge.red{background:var(--red-light);color:var(--red-text);}
  .row-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .row-item:last-child{border-bottom:none;}
  .row-name{font-size:14px;color:var(--text);}
  .row-val{font-size:14px;font-weight:600;color:var(--text);}
  .add-btn{width:100%;padding:14px;background:#fff;border:1px dashed var(--border);border-radius:14px;color:var(--text-secondary);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-family:inherit;}
  .add-btn:active{background:var(--gray-bg);}
  .bottom-nav{display:flex;background:#fff;border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;z-index:10;}
  .bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text-secondary);cursor:pointer;padding:4px 0;font-weight:500;}
  .bnav-item.active{color:var(--blue);}
  .bnav-icon{font-size:22px;line-height:1;}
  .loading-state{text-align:center;padding:3rem 1rem;color:var(--text-secondary);font-size:14px;}
  .spinner{width:28px;height:28px;border:2px solid var(--border);border-top:2px solid var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .raw-table{width:100%;font-size:13px;border-collapse:collapse;table-layout:fixed;}
  .raw-table th{text-align:left;font-size:11px;font-weight:600;color:var(--text-secondary);padding:0 8px 8px 0;text-transform:uppercase;letter-spacing:0.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .raw-table td{padding:8px 8px 8px 0;color:var(--text);border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:top;}
  .raw-table tr:last-child td{border-bottom:none;}
  .empty{color:var(--text-secondary);font-size:13px;padding:1rem 0;text-align:center;}
  .last-sync{text-align:center;font-size:11px;color:var(--text-tertiary);padding:8px 0 0;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="header-title">iPlanIt</span>
    <button class="sync-btn loading" id="syncBtn" onclick="loadAll()">
      <span id="syncIcon">⟳</span>
      <span id="syncText">Loading...</span>
    </button>
  </div>

  <div class="nav" id="tabNav">
    <div class="nav-item active" onclick="showTab('overview',this)">Overview</div>
    <div class="nav-item" onclick="showTab('debts',this)">Debts</div>
    <div class="nav-item" onclick="showTab('inst',this)">Inst</div>
    <div class="nav-item" onclick="showTab('trips',this)">Trips</div>
    <div class="nav-item" onclick="showTab('varanasi',this)">Varanasi</div>
    <div class="nav-item" onclick="showTab('vietnam',this)">Vietnam</div>
    <div class="nav-item" onclick="showTab('bromo',this)">Bromo</div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div>Fetching your data...</div>
  </div>

  <div class="bottom-nav">
    <div class="bnav-item active" id="bn-overview" onclick="showTab('overview',null,'overview')">
      <span class="bnav-icon">⌂</span>Home
    </div>
    <div class="bnav-item" id="bn-debts" onclick="showTab('debts',null,'debts')">
      <span class="bnav-icon">💳</span>Debts
    </div>
    <div class="bnav-item" id="bn-trips" onclick="showTab('trips',null,'trips')">
      <span class="bnav-icon">✈</span>Trips
    </div>
    <div class="bnav-item" id="bn-bromo" onclick="showTab('bromo',null,'bromo')">
      <span class="bnav-icon">☑</span>Items
    </div>
    <div class="bnav-item" id="bn-sync" onclick="loadAll()">
      <span class="bnav-icon">↻</span>Sync
    </div>
  </div>
</div>

<script>
const API_KEY = 'AIzaSyBoZw92mZIlcZLe_9OQ62C9mZI20yR6V0s';
const SHEET_ID = '1j5DNBx8X_6_B4hn3VgBFAMd_CaFPhmNGPWNDfxJEo9c';
const BASE = 'https://sheets.googleapis.com/v4/spreadsheets';

let sheetData = {};
let currentTab = 'overview';
let lastSync = null;

async function fetchSheet(range) {
  const url = `${BASE}/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) {
    const err = await r.json();
    throw new Error(err.error?.message || 'Unknown error');
  }
  const d = await r.json();
  return d.values || [];
}

async function loadAll() {
  const btn = document.getElementById('syncBtn');
  const syncText = document.getElementById('syncText');
  const syncIcon = document.getElementById('syncIcon');
  btn.className = 'sync-btn loading';
  syncText.textContent = 'Syncing...';
  syncIcon.textContent = '⟳';
  try {
    const [debts, inst, trips, varanasi, vietnam, bromo] = await Promise.all([
      fetchSheet('Debts!A1:F20'),
      fetchSheet('Inst!A1:F20'),
      fetchSheet('Trips!A1:F20'),
      fetchSheet('Varanasi!A1:F30'),
      fetchSheet('Vietnam!A1:F30'),
      fetchSheet('Bromo Items!A1:F30'),
    ]);
    sheetData = { debts, inst, trips, varanasi, vietnam, bromo };
    btn.className = 'sync-btn ok';
    syncText.textContent = 'Synced';
    syncIcon.textContent = '✓';
    lastSync = new Date();
    renderTab(currentTab);
  } catch(e) {
    btn.className = 'sync-btn err';
    syncText.textContent = 'Retry';
    syncIcon.textContent = '!';
    document.getElementById('mainContent').innerHTML = `
      <div class="loading-state">
        <div style="font-size:32px;margin-bottom:12px;">⚠️</div>
        <div style="font-weight:600;margin-bottom:8px;">Could not sync</div>
        <div style="font-size:12px;color:#999;margin-bottom:16px;">${e.message}</div>
        <button class="add-btn" onclick="loadAll()">↻ Try again</button>
      </div>`;
  }
}

function parseRM(val) {
  if (!val) return 0;
  return parseFloat(String(val).replace(/[^0-9.]/g,'')) || 0;
}

function isSettled(dateStr) {
  if (!dateStr) return false;
  const parts = dateStr.match(/(\d+)\s+(\w+)\s+(\d+)/);
  if (!parts) return false;
  try { return new Date(dateStr) < new Date(); } catch(e) { return false; }
}

function showTab(id, navEl, bn) {
  currentTab = id;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (navEl) {
    navEl.classList.add('active');
  } else {
    document.querySelectorAll('.nav-item').forEach(n => {
      if (n.textContent.trim().toLowerCase() === id.toLowerCase()) n.classList.add('active');
    });
  }
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));
  const bnEl = document.getElementById('bn-' + (bn || id));
  if (bnEl) bnEl.classList.add('active');
  if (Object.keys(sheetData).length > 0) renderTab(id);
}

function renderRawTable(rows) {
  if (!rows || rows.length === 0) return '<div class="empty">No data found.</div>';
  const dataRows = rows.filter(r => r && r.some(c => c && String(c).trim()));
  if (dataRows.length === 0) return '<div class="empty">No data found.</div>';
  const headers = dataRows[0];
  const body = dataRows.slice(1);
  if (body.length === 0) return '<div class="empty">No rows yet.</div>';
  return `<table class="raw-table">
    <thead><tr>${headers.map(h=>`<th>${h||''}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r=>`<tr>${headers.map((_,i)=>`<td title="${r[i]||''}">${r[i]||''}</td>`).join('')}</tr>`).join('')}
    </tbody></table>`;
}

function renderTab(id) {
  const el = document.getElementById('mainContent');
  const syncLine = lastSync ? `<div class="last-sync">Last synced ${lastSync.toLocaleTimeString()}</div>` : '';

  if (id === 'overview') {
    const drows = (sheetData.debts||[]).slice(1).filter(r=>r&&r[0]&&r[0].trim()&&!r[0].startsWith('Last')&&!r[0].startsWith('*'));
    const total = drows.reduce((s,r)=>s+parseRM(r[4]),0);
    const monthly = drows.reduce((s,r)=>s+parseRM(r[1]),0);
    const maxMonths = drows.reduce((m,r)=>Math.max(m,parseInt(r[2])||0),0);
    el.innerHTML = `
      <div class="hero">
        <div class="hero-label">Total pending amount</div>
        <div class="hero-amount">RM ${total.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="hero-sub">${drows.length} active debt${drows.length!==1?'s':''}</div>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-label">Monthly outflow</div><div class="stat-val amber">RM ${Math.round(monthly).toLocaleString()}</div></div>
        <div class="stat"><div class="stat-label">Months to clear</div><div class="stat-val green">${maxMonths} mo</div></div>
        <div class="stat"><div class="stat-label">Total debts</div><div class="stat-val">${drows.length}</div></div>
        <div class="stat"><div class="stat-label">Tabs tracked</div><div class="stat-val">6</div></div>
      </div>
      <div class="section-label">Debts snapshot</div>
      ${drows.map(r=>{
        const months = parseInt(r[2])||1;
        const pct = Math.min(95,Math.max(8,100-(months/6)*100));
        const settled = isSettled(r[3]);
        return `<div class="card">
          <div class="card-row">
            <div>
              <div class="card-name">${r[0]}</div>
              <div class="card-sub">${r[1]||'—'}/mo · ${months} months left</div>
            </div>
            <div>
              <div class="card-amount">${r[4]||'—'}</div>
              <div class="card-amount-sub">pending</div>
            </div>
          </div>
          <div class="pbar"><div class="pfill" style="width:${pct}%;background:${settled?'#1D9E75':'#378ADD'};"></div></div>
          ${settled?'<span class="badge green">✓ Likely settled</span>':'<span class="badge blue">Active</span>'}
        </div>`;
      }).join('')}
      ${syncLine}`;
  }

  else if (id === 'debts') {
    const drows = (sheetData.debts||[]).slice(1).filter(r=>r&&r[0]&&r[0].trim()&&!r[0].startsWith('Last')&&!r[0].startsWith('*'));
    el.innerHTML = `
      <div class="section-label">Active debts</div>
      ${drows.map(r=>{
        const months = parseInt(r[2])||1;
        const pct = Math.min(95,Math.max(8,100-(months/6)*100));
        const settled = isSettled(r[3]);
        return `<div class="card">
          <div class="card-row">
            <div>
              <div class="card-name">${r[0]}</div>
              ${settled?'<div style="margin-top:5px;"><span class="badge green">✓ Likely settled</span></div>':'<div class="card-sub">'+months+' months left</div>'}
            </div>
            <div>
              <div class="card-amount">${r[4]||'—'}</div>
              <div class="card-amount-sub">remaining</div>
            </div>
          </div>
          <div class="pbar"><div class="pfill" style="width:${pct}%;background:${settled?'#1D9E75':'#378ADD'};"></div></div>
          <div class="meta">
            <div class="meta-item">📅 ${r[3]||'—'}</div>
            <div class="meta-item">💰 ${r[1]||'—'}/mo</div>
          </div>
        </div>`;
      }).join('')}
      <button class="add-btn" onclick="alert('Open your Google Sheet to add a new debt, then tap Sync to refresh.')">+ Add debt (via Google Sheet)</button>
      ${syncLine}`;
  }

  else if (id === 'inst') {
    const rows = (sheetData.inst||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    el.innerHTML = `<div class="section-label">Instalments</div><div class="card">${renderRawTable(rows)}</div>${syncLine}`;
  }

  else if (id === 'trips') {
    const rows = (sheetData.trips||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    el.innerHTML = `<div class="section-label">Trips</div><div class="card">${renderRawTable(rows)}</div>
      <button class="add-btn" onclick="alert('Open your Google Sheet to add a trip, then tap Sync.')">+ Add trip (via Google Sheet)</button>
      ${syncLine}`;
  }

  else if (id === 'varanasi') {
    const rows = (sheetData.varanasi||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    el.innerHTML = `<div class="section-label">Varanasi</div><div class="card">${renderRawTable(rows)}</div>${syncLine}`;
  }

  else if (id === 'vietnam') {
    const rows = (sheetData.vietnam||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    el.innerHTML = `<div class="section-label">Vietnam</div><div class="card">${renderRawTable(rows)}</div>${syncLine}`;
  }

  else if (id === 'bromo') {
    const rows = (sheetData.bromo||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    el.innerHTML = `<div class="section-label">Bromo items</div><div class="card">${renderRawTable(rows)}</div>
      <button class="add-btn" onclick="alert('Open your Google Sheet to add items, then tap Sync.')">+ Add item (via Google Sheet)</button>
      ${syncLine}`;
  }
}

loadAll();
</script>
</body>
</html>
