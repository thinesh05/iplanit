<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="iPlanIt"/>
<title>iPlanIt</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;width:100%;overflow:hidden;background:#000;}
:root{
  --bg:#111113;--bg2:#1C1C1E;--bg3:#2C2C2E;--bg4:#3A3A3C;
  --border:#38383A;--text:#fff;--text2:#EBEBF5CC;--text3:#EBEBF599;
  --blue:#0A84FF;--blue-bg:#0A84FF22;
  --green:#30D158;--green-bg:#30D15822;
  --amber:#FFD60A;--amber-bg:#FFD60A22;
  --red:#FF453A;--red-bg:#FF453A22;
  --purple:#BF5AF2;--purple-bg:#BF5AF222;
}
.app{display:flex;flex-direction:column;height:100dvh;width:100%;background:var(--bg);overflow:hidden;}
.header{flex-shrink:0;background:var(--bg2);padding-top:calc(env(safe-area-inset-top,44px) + 8px);padding-left:16px;padding-right:16px;padding-bottom:12px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.header-title{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.3px;}
.sync-btn{display:flex;align-items:center;gap:5px;font-size:12px;padding:5px 12px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-family:inherit;}
.sync-btn.ok{background:var(--green-bg);color:var(--green);}
.sync-btn.loading{background:var(--amber-bg);color:var(--amber);}
.sync-btn.err{background:var(--red-bg);color:var(--red);}
.nav{flex-shrink:0;display:flex;background:var(--bg2);border-bottom:0.5px solid var(--border);overflow-x:auto;scrollbar-width:none;}
.nav::-webkit-scrollbar{display:none;}
.nav-item{flex:0 0 auto;padding:10px 16px;font-size:13px;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;}
.nav-item.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 0;}
.content-inner{padding-bottom:16px;}
.hero{background:var(--blue);border-radius:16px;padding:20px;margin-bottom:14px;}
.hero-label{font-size:12px;color:rgba(255,255,255,0.7);margin-bottom:5px;font-weight:500;}
.hero-amount{font-size:28px;font-weight:700;color:#fff;margin-bottom:3px;letter-spacing:-0.5px;}
.hero-sub{font-size:12px;color:rgba(255,255,255,0.6);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat{background:var(--bg2);border-radius:12px;padding:12px 14px;border:0.5px solid var(--border);}
.stat-label{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500;}
.stat-val{font-size:18px;font-weight:700;color:var(--text);}
.stat-val.green{color:var(--green);}
.stat-val.amber{color:var(--amber);}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:10px;margin-left:4px;}
.card{background:var(--bg2);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:0.5px solid var(--border);}
.card-row{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.card-name{font-size:15px;font-weight:600;color:var(--text);}
.card-sub{font-size:12px;color:var(--text3);margin-top:3px;}
.card-amount{font-size:15px;font-weight:700;color:var(--text);text-align:right;}
.card-amount-sub{font-size:11px;color:var(--text3);text-align:right;margin-top:3px;}
.pbar{height:5px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:10px;}
.pfill{height:100%;border-radius:4px;transition:width 0.6s ease;}
.meta{display:flex;gap:12px;flex-wrap:wrap;}
.meta-item{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:4px;}
.badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.blue{background:var(--blue-bg);color:var(--blue);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.purple{background:var(--purple-bg);color:var(--purple);}
.trip-card{background:var(--bg2);border-radius:14px;padding:14px 16px;margin-bottom:10px;border:0.5px solid var(--border);}
.trip-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.trip-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;background:var(--bg3);}
.trip-title{font-size:15px;font-weight:600;color:var(--text);}
.trip-sub{font-size:12px;color:var(--text3);margin-top:2px;}
.trip-status-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
.trip-status-label{font-size:12px;color:var(--text3);}
.add-btn{width:100%;padding:14px;background:var(--bg2);border:0.5px solid var(--border);border-radius:14px;color:var(--text2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;font-family:inherit;font-weight:500;}
.add-btn:active{opacity:0.6;}
.bottom-nav{flex-shrink:0;display:flex;background:var(--bg2);border-top:0.5px solid var(--border);padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom,20px) + 4px);}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);cursor:pointer;padding:0 4px;font-weight:500;}
.bnav-item.active{color:var(--blue);}
.bnav-icon{font-size:22px;line-height:1.2;}
.loading-state{text-align:center;padding:3rem 1rem;color:var(--text3);font-size:14px;}
.spinner{width:28px;height:28px;border:2.5px solid var(--bg3);border-top:2.5px solid var(--blue);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px;}
@keyframes spin{to{transform:rotate(360deg);}}
.raw-table{width:100%;font-size:12px;border-collapse:collapse;table-layout:fixed;}
.raw-table th{text-align:left;font-size:10px;font-weight:600;color:var(--text3);padding:0 6px 8px 0;text-transform:uppercase;letter-spacing:0.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.raw-table td{padding:8px 6px 8px 0;color:var(--text2);border-bottom:0.5px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.raw-table tr:last-child td{border-bottom:none;}
.empty{color:var(--text3);font-size:13px;padding:1.5rem 0;text-align:center;}
.last-sync{text-align:center;font-size:11px;color:var(--text3);padding:12px 0 4px;}
.row-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:0.5px solid var(--border);}
.row-item:last-child{border-bottom:none;}
.row-name{font-size:14px;color:var(--text);}
.row-val{font-size:14px;font-weight:600;color:var(--text);}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <span class="header-title">iPlanIt</span>
    <button class="sync-btn loading" id="syncBtn" onclick="loadAll()">
      <span id="syncIcon">⟳</span> <span id="syncText">Loading...</span>
    </button>
  </div>
  <div class="nav">
    <div class="nav-item active" onclick="showTab('overview',this)">Overview</div>
    <div class="nav-item" onclick="showTab('debts',this)">Debts</div>
    <div class="nav-item" onclick="showTab('inst',this)">Instalments</div>
    <div class="nav-item" onclick="showTab('trips',this)">Trips</div>
    <div class="nav-item" onclick="showTab('varanasi',this)">Varanasi</div>
    <div class="nav-item" onclick="showTab('vietnam',this)">Vietnam</div>
    <div class="nav-item" onclick="showTab('bromo',this)">Items</div>
  </div>
  <div class="content" id="mainContent">
    <div class="content-inner">
      <div class="loading-state"><div class="spinner"></div>Fetching your data...</div>
    </div>
  </div>
  <div class="bottom-nav">
    <div class="bnav-item active" id="bn-overview" onclick="showTab('overview',null,'overview')"><span class="bnav-icon">⌂</span>Home</div>
    <div class="bnav-item" id="bn-debts" onclick="showTab('debts',null,'debts')"><span class="bnav-icon">💳</span>Debts</div>
    <div class="bnav-item" id="bn-trips" onclick="showTab('trips',null,'trips')"><span class="bnav-icon">✈</span>Trips</div>
    <div class="bnav-item" id="bn-bromo" onclick="showTab('bromo',null,'bromo')"><span class="bnav-icon">☑</span>Items</div>
    <div class="bnav-item" id="bn-sync" onclick="loadAll()"><span class="bnav-icon">↻</span>Sync</div>
  </div>
</div>
<script>
const API_KEY='AIzaSyBoZw92mZIlcZLe_9OQ62C9mZI20yR6V0s';
const SHEET_ID='1j5DNBx8X_6_B4hn3VgBFAMd_CaFPhmNGPWNDfxJEo9c';
const BASE='https://sheets.googleapis.com/v4/spreadsheets';
let sheetData={},currentTab='overview',lastSync=null;

async function fetchSheet(range){
  const r=await fetch(`${BASE}/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`);
  if(!r.ok){const e=await r.json();throw new Error(e.error?.message||'Error');}
  return(await r.json()).values||[];
}
async function loadAll(){
  const btn=document.getElementById('syncBtn');
  document.getElementById('syncText').textContent='Syncing...';
  document.getElementById('syncIcon').textContent='⟳';
  btn.className='sync-btn loading';
  try{
    const [debts,inst,trips,varanasi,vietnam,bromo]=await Promise.all([
      fetchSheet('Debts!A1:F20'),fetchSheet('Inst!A1:F20'),fetchSheet('Trips!A1:F20'),
      fetchSheet('Varanasi!A1:F30'),fetchSheet('Vietnam!A1:F30'),fetchSheet('Bromo Items!A1:F30'),
    ]);
    sheetData={debts,inst,trips,varanasi,vietnam,bromo};
    btn.className='sync-btn ok';
    document.getElementById('syncText').textContent='Synced';
    document.getElementById('syncIcon').textContent='✓';
    lastSync=new Date();
    renderTab(currentTab);
  }catch(e){
    btn.className='sync-btn err';
    document.getElementById('syncText').textContent='Retry';
    document.getElementById('syncIcon').textContent='!';
    setContent(`<div class="loading-state"><div style="font-size:32px;margin-bottom:12px;">⚠️</div>
      <div style="font-weight:600;color:#fff;margin-bottom:8px;">Could not sync</div>
      <div style="font-size:12px;margin-bottom:16px;">${e.message}</div>
      <button class="add-btn" onclick="loadAll()">↻ Try again</button></div>`);
  }
}
function setContent(html){document.getElementById('mainContent').innerHTML=`<div class="content-inner">${html}</div>`;}
function parseRM(v){if(!v)return 0;return parseFloat(String(v).replace(/[^0-9.]/g,''))||0;}
function isSettled(d){if(!d)return false;try{return new Date(d)<new Date();}catch(e){return false;}}
function syncLine(){return lastSync?`<div class="last-sync">Last synced ${lastSync.toLocaleTimeString()}</div>`:''}

function showTab(id,navEl,bn){
  currentTab=id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  if(navEl)navEl.classList.add('active');
  else document.querySelectorAll('.nav-item').forEach(n=>{if(n.textContent.trim().toLowerCase()===id.toLowerCase())n.classList.add('active');});
  document.querySelectorAll('.bnav-item').forEach(b=>b.classList.remove('active'));
  const bnEl=document.getElementById('bn-'+(bn||id));
  if(bnEl)bnEl.classList.add('active');
  if(Object.keys(sheetData).length>0)renderTab(id);
}

function renderRawTable(rows){
  const data=rows.filter(r=>r&&r.some(c=>c&&String(c).trim()));
  if(!data.length)return '<div class="empty">No data found.</div>';
  const headers=data[0],body=data.slice(1);
  if(!body.length)return '<div class="empty">No rows yet.</div>';
  return `<table class="raw-table"><thead><tr>${headers.map(h=>`<th>${h||''}</th>`).join('')}</tr></thead>
    <tbody>${body.map(r=>`<tr>${headers.map((_,i)=>`<td title="${r[i]||''}">${r[i]||''}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

const tripMeta={varanasi:{icon:'🇮🇳',color:'#30D158',status:'Planning',pct:30},vietnam:{icon:'🇻🇳',color:'#0A84FF',status:'Upcoming',pct:55},bromo:{icon:'🌋',color:'#FFD60A',status:'Ready',pct:80}};

function renderTab(id){
  if(id==='overview'){
    const dr=(sheetData.debts||[]).slice(1).filter(r=>r&&r[0]&&r[0].trim()&&!r[0].startsWith('Last')&&!r[0].startsWith('*'));
    const total=dr.reduce((s,r)=>s+parseRM(r[4]),0);
    const monthly=dr.reduce((s,r)=>s+parseRM(r[1]),0);
    const maxM=dr.reduce((m,r)=>Math.max(m,parseInt(r[2])||0),0);
    setContent(`
      <div class="hero">
        <div class="hero-label">Total pending amount</div>
        <div class="hero-amount">RM ${total.toLocaleString('en-MY',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
        <div class="hero-sub">${dr.length} active debt${dr.length!==1?'s':''}</div>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="stat-label">Monthly outflow</div><div class="stat-val amber">RM ${Math.round(monthly).toLocaleString()}</div></div>
        <div class="stat"><div class="stat-label">Months to clear</div><div class="stat-val green">${maxM} mo</div></div>
        <div class="stat"><div class="stat-label">Total debts</div><div class="stat-val">${dr.length}</div></div>
        <div class="stat"><div class="stat-label">Tabs tracked</div><div class="stat-val">6</div></div>
      </div>
      <div class="section-label">Debts snapshot</div>
      ${dr.map(r=>{
        const m=parseInt(r[2])||1,pct=Math.min(95,Math.max(8,100-(m/6)*100)),s=isSettled(r[3]);
        return `<div class="card"><div class="card-row">
          <div><div class="card-name">${r[0]}</div><div class="card-sub">${r[1]||'—'}/mo · ${m} months left</div></div>
          <div><div class="card-amount">${r[4]||'—'}</div><div class="card-amount-sub">pending</div></div>
          </div><div class="pbar"><div class="pfill" style="width:${pct}%;background:${s?'#30D158':'#0A84FF'};"></div></div>
          ${s?'<span class="badge green">✓ Likely settled</span>':'<span class="badge blue">Active</span>'}
        </div>`;
      }).join('')}${syncLine()}`);
  }
  else if(id==='debts'){
    const dr=(sheetData.debts||[]).slice(1).filter(r=>r&&r[0]&&r[0].trim()&&!r[0].startsWith('Last')&&!r[0].startsWith('*'));
    setContent(`<div class="section-label">Active debts</div>
      ${dr.map(r=>{
        const m=parseInt(r[2])||1,pct=Math.min(95,Math.max(8,100-(m/6)*100)),s=isSettled(r[3]);
        return `<div class="card"><div class="card-row">
          <div><div class="card-name">${r[0]}</div>${s?'<div style="margin-top:5px;"><span class="badge green">✓ Likely settled</span></div>':'<div class="card-sub">'+m+' months left</div>'}</div>
          <div><div class="card-amount">${r[4]||'—'}</div><div class="card-amount-sub">remaining</div></div>
          </div><div class="pbar"><div class="pfill" style="width:${pct}%;background:${s?'#30D158':'#0A84FF'};"></div></div>
          <div class="meta"><div class="meta-item">📅 ${r[3]||'—'}</div><div class="meta-item">💰 ${r[1]||'—'}/mo</div></div>
        </div>`;
      }).join('')}
      <button class="add-btn" onclick="alert('Edit your Google Sheet, then tap Sync.')">+ Add debt (via Google Sheet)</button>${syncLine()}`);
  }
  else if(id==='inst'){
    const rows=(sheetData.inst||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    setContent(`<div class="section-label">Monthly instalments</div><div class="card">${renderRawTable(rows)}</div>${syncLine()}`);
  }
  else if(id==='trips'){
    const trips=['varanasi','vietnam','bromo'];
    const tripNames={varanasi:'Varanasi',vietnam:'Vietnam',bromo:'Bromo'};
    setContent(`<div class="section-label">Planned trips</div>
      ${trips.map(t=>{
        const meta=tripMeta[t];
        const statusColor=t==='varanasi'?'green':t==='vietnam'?'amber':'blue';
        return `<div class="trip-card">
          <div class="trip-header">
            <div class="trip-icon">${meta.icon}</div>
            <div><div class="trip-title">${tripNames[t]}</div><div class="trip-sub">Trip details in sheet</div></div>
          </div>
          <div class="trip-status-row"><span class="trip-status-label">Status</span><span class="badge ${statusColor}">${meta.status}</span></div>
          <div class="pbar"><div class="pfill" style="width:${meta.pct}%;background:${meta.color};"></div></div>
        </div>`;
      }).join('')}
      <button class="add-btn" onclick="alert('Edit your Google Sheet, then tap Sync.')">+ Add trip (via Google Sheet)</button>${syncLine()}`);
  }
  else if(id==='varanasi'){
    const rows=(sheetData.varanasi||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    setContent(`<div class="section-label">Varanasi</div><div class="card">${renderRawTable(rows)}</div>${syncLine()}`);
  }
  else if(id==='vietnam'){
    const rows=(sheetData.vietnam||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    setContent(`<div class="section-label">Vietnam</div><div class="card">${renderRawTable(rows)}</div>${syncLine()}`);
  }
  else if(id==='bromo'){
    const rows=(sheetData.bromo||[]).filter(r=>r&&r.some(c=>c&&String(c).trim()));
    setContent(`<div class="section-label">Bromo items</div><div class="card">${renderRawTable(rows)}</div>
      <button class="add-btn" onclick="alert('Edit your Google Sheet, then tap Sync.')">+ Add item (via Google Sheet)</button>${syncLine()}`);
  }
}
loadAll();
</script>
</body>
</html>
